<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

  <div class="max-w-screen-xl mx-auto bg-white rounded-lg shadow p-6">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Attendance Sheet</h1>
    </div>

    <!-- Filter Section -->
    <div class="flex flex-wrap gap-4 mb-4">
      <div>
        <label class="block mb-1 font-semibold">Select Year*</label>
        <select class="border border-gray-300 rounded px-4 py-2">
          <option>2024</option>
          <option>2023</option>
        </select>
      </div>
      <div>
        <label class="block mb-1 font-semibold">Select Month*</label>
        <select class="border border-gray-300 rounded px-4 py-2">
          <option>November</option>
          <option>October</option>
        </select>
      </div>
      <div class="self-end">
        <button class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Search</button>
      </div>
    </div>

    <p class="mb-4 text-gray-600">Filtered by: Year: 2024 | Month: November</p>

    <!-- Table -->
    <div class="overflow-x-auto scrollbar-thin scrollbar-thumb-gray-400 scrollbar-track-gray-200">
      <table class="min-w-full table-fixed text-sm text-center border-collapse">
        <thead>
          <tr class="bg-gray-100">
            <th class="w-40 px-4 py-2 text-left">Employee Name</th>
            <!-- Generate days -->
            <!-- Days 1-31 -->
            <script>
              document.addEventListener("DOMContentLoaded", () => {
                const theadRow = document.querySelector("thead tr");
                for (let i = 1; i <= 31; i++) {
                  const th = document.createElement("th");
                  th.className = "w-8 px-2 py-1";
                  th.textContent = i;
                  theadRow.appendChild(th);
                }
              });
            </script>
          </tr>
        </thead>
        <tbody class="text-gray-700">
          <!-- Sample Employee Row -->
          <tr class="border-t">
            <td class="flex items-center gap-2 px-4 py-2 text-left">
              <img src="https://randomuser.me/api/portraits/women/1.jpg" class="w-8 h-8 rounded-full" alt="Avatar">
              Jacob Ryan
            </td>
            <!-- Sample status icons -->
            <!-- Replace below with dynamic loop or more <td> if needed -->
            <td colspan="31" class="px-2 py-2 text-center text-gray-400">[Insert attendance status per day]</td>
          </tr>
          <!-- Add more employee rows -->
        </tbody>
      </table>
    </div>

    <!-- Legend -->
    <div class="mt-4 flex gap-4 text-sm">
      <div class="flex items-center gap-1"><span class="text-gray-500">⚪</span> Weekend</div>
      <div class="flex items-center gap-1"><span class="text-green-500">✔️</span> Present</div>
      <div class="flex items-center gap-1"><span class="text-red-500">❌</span> Leave</div>
      <div class="flex items-center gap-1"><span class="text-yellow-500">⭐</span> Holiday</div>
    </div>
  </div>

</body>
</html>
